<!DOCTYPE html><html><body style="margin:0;background:#1a1d2b;color:#9fb;font:12px monospace"><p style="margin:8px">SpaceTroid art sheet (work in progress): hero poses at 5x, run cycle animating top right.</p><canvas id="c" width="1200" height="760"></canvas>
<script src="js/util.js"></script><script src="js/px.js"></script><script src="js/palette.js"></script><script src="js/art.js"></script><script src="js/art/hero.js"></script>
<script>
const G=SGS, ctx=document.getElementById('c').getContext('2d'); ctx.imageSmoothingEnabled=false;
const hp=G.art.heroParts; let x=10, y=10, n=0;
for (const k in hp) { const s=G.art.make(hp[k],'cobalt',k); ctx.fillStyle='#2a3050'; ctx.fillRect(x,y,s.w*5,s.h*5); ctx.drawImage(s.c,x,y,s.w*5,s.h*5); ctx.fillStyle='#9fb'; ctx.fillText(k,x,y+s.h*5+12); x+=s.w*5+14; if(++n%7===0){x=10;y+=s.h*5+30;} }

const names=Object.keys(hp).filter(k=>k.startsWith('run')), spr=names.map(k=>G.art.make(hp[k],'cobalt',k)); const an=document.createElement('canvas'); an.width=300; an.height=260; an.style.cssText='position:fixed;right:10px;top:10px;background:#2a3050'; document.body.append(an); const ax=an.getContext('2d'); ax.imageSmoothingEnabled=false;
setInterval(()=>{ const f=Math.floor(Date.now()/85)%spr.length; ax.clearRect(0,0,300,260); ax.drawImage(spr[f].c,40,10,28*8,45*5.5); },40);
</script></body></html>
